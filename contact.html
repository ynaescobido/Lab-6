
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | My Musical Hobby</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar md:navbar-expand bg-1 fg-2">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">My Musical Hobby</a>

      <button class="btn-icon navbar-toggler" type="button"
        data-bs-toggle="drawer" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" aria-hidden="true"></span>
      </button>

      <dialog class="drawer drawer-end" id="navbarNav"
        tabindex="-1" aria-labelledby="navbarNavLabel">
        <div class="drawer-header">
          <h2 class="drawer-title" id="navbarNavLabel">Menu</h2>
          <button type="button" class="btn-close"
            data-bs-dismiss="drawer" aria-label="Close"></button>
        </div>
        <div class="drawer-body">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html#music">My Music</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page"
                href="contact.html">Contact</a>
            </li>
          </ul>
        </div>
      </dialog>
    </div>
  </nav>

  <main class="container py-4">
    <h1>Contact Me</h1>
    <p>Have a question about guitar, vinyl records, or concerts?
      Send me a message.</p>

    <form action="#" method="get">
      <div class="row g-4">

        <div class="col-12 md:col-6">
          <div class="form-field">
            <label for="firstName" class="form-label">First Name</label>
            <input type="text" class="form-control"
              id="firstName" name="firstName" required>
          </div>
        </div>

        <div class="col-12 md:col-6">
          <div class="form-field">
            <label for="lastName" class="form-label">Last Name</label>
            <input type="text" class="form-control"
              id="lastName" name="lastName" required>
          </div>
        </div>

        <div class="col-12 md:col-6">
          <div class="form-field">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control"
              id="email" name="email"
              placeholder="name@example.com" required>
          </div>
        </div>

        <div class="col-12 md:col-6">
          <div class="form-field">
            <label for="topic" class="form-label">Music Interest</label>
            <select class="form-control" id="topic" name="topic" required>
              <option value="">Choose a topic</option>
              <option value="guitar">Guitar</option>
              <option value="vinyl">Vinyl Records</option>
              <option value="concerts">Concerts</option>
            </select>
          </div>
        </div>

        <div class="col-12">
          <div class="form-field">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message"
              name="message" rows="4" required></textarea>
          </div>
        </div>

        <div class="col-12">
          <div class="form-field">
            <input type="checkbox" class="check"
              id="consent" name="consent" required>
            <label for="consent">I agree to be contacted.</label>
          </div>
        </div>

        <div class="col-12">
          <button type="submit" class="btn-solid theme-primary">
            Submit
          </button>
        </div>

      </div>
    </form>
  </main>

  <footer class="container py-4">
    <p>My Musical Hobby</p>
  </footer>

  <script type="module" src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
